name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify committed dist/ is up to date
        shell: bash
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist/ is stale. Run 'npm run build' and commit the result."
            git status --porcelain dist
            git --no-pager diff -- dist
            exit 1
          fi
